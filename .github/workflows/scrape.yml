name: Scrape Engage Columbus Sitemap

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Run scraper
        run: php main.php

      - name: Store scraped content for debugging (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-${{ github.run_id }}
          path: |
            scraper-output.html
            scraper-debug.log
          retention-days: 30

      - name: Validate feed XML
        run: php -r '$xml = simplexml_load_file("feed.xml"); if ($xml === false) { fwrite(STDERR, "Invalid feed.xml\n"); exit(1);} echo "feed.xml is valid XML\n";'
        # Only runs when feed.xml exists (first run creates it; skipped if no new URLs)
        if: hashFiles('feed.xml') != ''

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/links.csv feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update links and feed [skip ci]"
            git push
